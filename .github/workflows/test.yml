name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Verify packaged Node import
        run: |
          scratch=$(mktemp -d)
          trap 'rm -r -- "$scratch"' EXIT
          archive=$(npm pack --pack-destination "$scratch" --silent)
          cd "$scratch"
          npm install --no-audit --no-fund "./$archive"
          node --input-type=module -e 'import assert from "node:assert/strict"; import { assistantReply, groupDecision } from "wechat-whale-core"; assert.equal(assistantReply("[不回]"), ""); assert.equal(groupDecision({}).shouldReply, false)'
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/setup.py
  wechat-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/setup.py --wechat
      - run: .\.venv\Scripts\wechat-whale.exe --help
        env:
          PYTHONIOENCODING: cp1252
