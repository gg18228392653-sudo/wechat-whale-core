[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-whale-core"
version = "0.1.0"
description = "WeChat conversation routing, batching, and media normalization"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.3"]

[project.optional-dependencies]
wechat = ["wechatauto-replica==1.2.9; sys_platform == 'win32'"]

[project.scripts]
wechat-whale-normalize = "wechat_whale_core.media_normalize:main"
wechat-whale = "wechat_whale_core.wechat_run:main"

[tool.setuptools]
packages = ["wechat_whale_core"]
